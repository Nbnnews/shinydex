<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédex Shiny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: classeur de collection. En-tête avec langue et progression, filtres par groupes,
   grille de cases (sprite normal grisé, sprite shiny en couleur une fois capturé), fiche à droite
   (feuille en bas sur téléphone). */
:root {
  color-scheme: light;
  --bg: #F1F2F6;
  --surface: #FFFFFF;
  --surface-2: #E8EBF2;
  --line: #D3D8E3;
  --fg: #151927;
  --fg-dim: #566074;
  --accent: #245F7D;
  --accent-ink: #FFFFFF;
  --foil-a: #F8DC82;
  --foil-b: #E69B3C;
  --foil-c: #C47818;
  --foil-ink: #3A2400;
  --foil-text: #8A5300;
  --foil-bg: #FFF3D2;
  --danger: #A32A2A;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", "Noto Sans CJK JP", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1017; --surface: #141A24; --surface-2: #1D2532; --line: #29323F;
    --fg: #E8ECF4; --fg-dim: #8F9AAF; --accent: #78BFDC; --accent-ink: #08141B;
    --foil-text: #F2C14E; --foil-bg: #2B2412; --danger: #F08A8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1017; --surface: #141A24; --surface-2: #1D2532; --line: #29323F;
  --fg: #E8ECF4; --fg-dim: #8F9AAF; --accent: #78BFDC; --accent-ink: #08141B;
  --foil-text: #F2C14E; --foil-bg: #2B2412; --danger: #F08A8A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* En-tête */
.head { display: grid; grid-template-columns: 1fr auto; gap: 16px 32px; align-items: end; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800;
  font-size: clamp(34px, 6vw, 56px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance;
}
h1 .foil {
  color: var(--foil-text);
  background: linear-gradient(100deg, var(--foil-a), var(--foil-b) 40%, var(--foil-c) 60%, var(--foil-a));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.sub { margin: 8px 0 0; color: var(--fg-dim); max-width: 52ch; }
.score { min-width: 0; width: min(100%, 280px); display: grid; gap: 4px; }
.langrow { display: grid; gap: 4px; margin-bottom: 8px; }
.langrow label { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; }
select#lang {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px;
}
.score .num { font-family: var(--font-mono); font-weight: 600; font-size: 30px; font-variant-numeric: tabular-nums; }
.score .num small { font-size: 15px; color: var(--fg-dim); font-weight: 400; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--foil-a), var(--foil-b)); transition: width .3s ease; }

/* Chargement et erreur */
.loader, .err { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; font-size: 14px; }
.err { border-color: var(--danger); color: var(--danger); grid-auto-flow: column; justify-content: space-between; align-items: center; }
.err button { border: 1px solid var(--danger); background: transparent; border-radius: 8px; padding: 6px 12px; font-weight: 600; color: inherit; }
.loader .bar { height: 6px; }

/* Filtres */
.filters { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.frow { display: grid; grid-template-columns: 110px 1fr; gap: 8px 14px; align-items: center; }
.flabel { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 13px;
  font-size: 14px; font-weight: 500; display: inline-flex; gap: 8px; align-items: baseline;
}
.chip .c { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--fg-dim); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] .c { color: inherit; opacity: .7; }
.search {
  width: 100%; max-width: 320px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 10px; padding: 8px 12px;
}
.search::placeholder { color: var(--fg-dim); }

/* Corps */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.meta { color: var(--fg-dim); font-size: 13.5px; margin-bottom: 12px; }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }

.tile { position: relative; min-width: 0; }
.open {
  width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 8px 8px 10px; display: grid; gap: 4px; justify-items: center; min-width: 0;
  transition: transform .12s ease, border-color .12s ease;
}
.open:hover { transform: translateY(-2px); border-color: var(--fg-dim); }
.tile.sel .open { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.no { justify-self: start; font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.art {
  width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: var(--surface-2);
}
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.art .mono { font-family: var(--font-display); font-weight: 800; font-size: 32px; color: var(--fg-dim); opacity: 0; }
.art.noimg { border: 1px dashed var(--line); }
.art.noimg .mono { opacity: .55; }
.tile:not(.got):not(.own) .art img { filter: grayscale(1); opacity: .6; }
.art .spark { display: none; position: absolute; right: -2px; top: -2px; width: 22px; height: 22px; fill: var(--foil-b); }
.tile.got .open { background: var(--foil-bg); border-color: var(--foil-b); }
.tile.got .art { background: radial-gradient(circle, var(--surface) 35%, var(--foil-a) 100%); box-shadow: 0 0 0 2px var(--foil-b); }
.tile.got .art .spark { display: block; }
.nm { font-weight: 600; font-size: 13.5px; text-align: center; overflow-wrap: anywhere; line-height: 1.2; }
.tag { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; min-height: 13px; text-align: center; overflow-wrap: anywhere; }
.tile.got .tag { color: var(--foil-text); }
/* Trois boutons par case : capturé, shiny, exclure */
.acts { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.ab {
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg);
  display: grid; place-items: center; padding: 0;
}
.ab svg { width: 15px; height: 15px; stroke: var(--fg-dim); fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.ab:hover svg { opacity: 1; }
.ab:disabled { cursor: default; }
.ab.cap[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.ab.cap[aria-pressed="true"] svg { stroke: var(--accent-ink); opacity: 1; }
.ab.mark[aria-pressed="true"] { background: var(--foil-b); border-color: var(--foil-c); }
.ab.mark[aria-pressed="true"] svg { stroke: var(--foil-ink); opacity: 1; }
.ab.exb[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); }
.ab.exb[aria-pressed="true"] svg { stroke: var(--bg); opacity: 1; }
.tile.own .open { border-color: var(--accent); }
.tile.own .art { box-shadow: 0 0 0 2px var(--accent); }
.tile.excl .open { opacity: .55; border-style: dashed; background: var(--surface); }
.tile.excl .cap, .tile.excl .mark { display: none; }
.tile.excl .tag { color: var(--fg-dim); }
/* Progression en en-tête et par génération */
.prog { display: grid; gap: 4px; }
.pl { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13px; font-weight: 600; }
.pl b { font-family: var(--font-mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.dexbar > i { background: var(--accent); }
.gens { display: grid; gap: 10px; }
.gens h2 { margin: 0; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.gc {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 12px; display: grid; gap: 10px; min-width: 0;
}
.gc:hover { border-color: var(--fg-dim); }
.gc[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.gc .gh { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.gc .gr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: baseline; font-size: 12.5px; color: var(--fg-dim); }
.gc .gr b { font-family: var(--font-mono); font-size: 16px; color: var(--fg); font-variant-numeric: tabular-nums; }
.gc .gr .bar { grid-column: 1 / -1; height: 6px; }
.empty { padding: 40px 16px; text-align: center; color: var(--fg-dim); border: 1px dashed var(--line); border-radius: 12px; }
.empty button { margin-top: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 600; }

/* Fiche détail */
.detail {
  position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px; display: grid; gap: 16px; min-width: 0; max-height: calc(100vh - 32px); overflow-y: auto;
}
.detail .close { display: none; }
.detail .hint { color: var(--fg-dim); margin: 0; }
.dname { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.05; overflow-wrap: anywhere; }
.dmeta { margin: 4px 0 0; color: var(--fg-dim); font-size: 13.5px; }
.dmeta b { font-family: var(--font-mono); font-weight: 600; color: var(--fg); }
.status { margin: 6px 0 0; font-weight: 600; font-size: 14px; }
.status.got { color: var(--foil-text); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fig { margin: 0; border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; gap: 4px; justify-items: center; background: var(--bg); position: relative; min-height: 138px; align-content: center; }
.fig img { width: 100%; max-width: 130px; height: auto; aspect-ratio: 1; object-fit: contain; }
.fig figcaption { font-size: 12px; color: var(--fg-dim); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.fig.on { border-color: var(--foil-b); background: var(--foil-bg); }
.fig.on figcaption { color: var(--foil-text); }
.fig.broken img { display: none; }
.cta { width: 100%; border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.cta.on { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.games h3 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-dim); }
.gen { margin-bottom: 10px; }
.gen h4 { margin: 0 0 5px; font-size: 12.5px; font-weight: 600; }
.gchips { display: flex; flex-wrap: wrap; gap: 5px; }
.g { font-size: 12.5px; border-radius: 7px; padding: 3px 8px; border: 1px dashed var(--line); color: var(--fg-dim); }
.g.yes { border: 1px solid var(--foil-b); background: var(--foil-bg); color: var(--foil-text); font-weight: 600; }
.g.na { opacity: .5; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-dim); margin: 6px 0 10px; }
.legend .g { display: inline-block; padding: 1px 7px; }
.gnote { font-size: 12.5px; color: var(--fg-dim); margin: 0 0 10px; }

.fcol { display: grid; gap: 10px; min-width: 0; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; width: fit-content; }
.toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
.diag { color: var(--fg-dim); font-size: 12.5px; }
.diag summary { cursor: pointer; font-weight: 600; }
.diag p { margin: 8px 0 0; overflow-wrap: anywhere; }
.diag .m { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; }

/* Pied de page */
.foot { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; color: var(--fg-dim); font-size: 12.5px; }
.foot button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.foot .credit { flex-basis: 100%; }

@media (max-width: 899px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .head { grid-template-columns: 1fr; align-items: start; }
  .frow { grid-template-columns: 1fr; }
  .detail {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 20;
    border-radius: 16px 16px 0 0; max-height: 78vh; overflow-y: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .25); transform: translateY(110%); transition: transform .22s ease;
    visibility: hidden;
  }
  .detail[data-open="true"] { transform: none; visibility: visible; }
  .detail .close { display: block; justify-self: end; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .open, .bar > i, .detail { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <h1>Pokédex <span class="foil">Shiny</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="score">
      <div class="langrow"><label for="lang" id="t-lang"></label><select id="lang"></select></div>
      <div class="prog"><div class="pl"><span id="t-dex"></span><b><span id="n-dex">0</span> / <span id="n-dex-all">0</span></b></div><div class="bar dexbar"><i id="bar-dex"></i></div></div>
      <div class="prog" aria-live="polite"><div class="pl"><span id="t-shiny"></span><b><span id="n-got">0</span> / <span id="n-all">0</span></b></div><div class="bar"><i id="bar"></i></div></div>
    </div>
  </header>

  <div class="loader" id="loader" hidden>
    <span id="loader-text"></span>
    <div class="bar"><i id="loader-bar"></i></div>
  </div>
  <div class="err" id="err" hidden><span id="err-text"></span><button type="button" id="retry"></button></div>

  <section class="gens" aria-labelledby="l-gens">
    <h2 id="l-gens"></h2>
    <div class="gcards" id="gens"></div>
  </section>

  <section class="filters">
    <div class="frow"><div class="flabel" id="l-gen"></div><div class="chips" id="f-gen" role="group" aria-labelledby="l-gen"></div></div>
    <div class="frow"><div class="flabel" id="l-cat"></div><div class="chips" id="f-cat" role="group" aria-labelledby="l-cat"></div></div>
    <div class="frow"><div class="flabel" id="l-form"></div><div class="fcol"><div class="chips" id="f-form" role="group" aria-labelledby="l-form"></div>
      <label class="toggle"><input type="checkbox" id="show-mega" checked><span id="t-showmega"></span></label></div></div>
    <div class="frow"><div class="flabel" id="l-st"></div><div class="chips" id="f-st" role="group" aria-labelledby="l-st"></div></div>
    <div class="frow"><label class="flabel" for="q" id="l-q"></label><input class="search" id="q" type="search" autocomplete="off"></div>
  </section>

  <div class="main">
    <section>
      <div class="meta" id="count"></div>
      <ul class="grid" id="grid"></ul>
      <div class="empty" id="empty" hidden><span id="empty-text"></span><br><button type="button" id="reset"></button></div>
    </section>
    <aside class="detail" id="detail"></aside>
  </div>

  <details class="diag" id="diag">
    <summary>Debug · forms (kept as "other" / excluded)</summary>
    <div id="diag-body"></div>
  </details>

  <footer class="foot">
    <button type="button" id="b-export"></button>
    <button type="button" id="b-import"></button>
    <button type="button" id="b-refresh"></button>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <span class="credit">Data &amp; sprites: PokeAPI (pokeapi.co) · github.com/PokeAPI/sprites</span>
  </footer>
</div>

  function avail(p, grp) {
    if (!grp.set.has(p.b)) return false;
    if (!p.f || p.f === "other") return true;
    if (p.f === "mega") return /^(x-y|omega-ruby|lets-go)/.test(grp.k) || grp.k.indexOf("z-a") >= 0;
    if (p.f === "gmax") return grp.k === "sword-shield";
    if (p.f === "hisui") return grp.k.indexOf("legends-arceus") >= 0 || grp.g >= 9;
    return grp.g >= p.fg;
  }

  // ---------- Rendu ----------
  function chip(group, val, label, count) {
    var on = String(f[group]) === String(val);
    return '<button type="button" class="chip" data-group="' + group + '" data-val="' + val + '" aria-pressed="' + on + '">' +
      esc(label) + (count ? ' <span class="c">' + count + '</span>' : "") + "</button>";
  }
  function hasN(id) { return owned.has(id) || caught.has(id); }
  function pct(n, total) { return total ? Math.floor(n * 100 / total) : 0; }
  // Progression par génération : Pokédex (capturés, shiny compris) et Shiny, hors Pokémon exclus
  function renderGens(list) {
    var by = {};
    list.forEach(function (p) {
      var o = by[p.g] || (by[p.g] = { n: 0, d: 0, s: 0 });
      o.n++; if (hasN(p.id)) o.d++; if (caught.has(p.id)) o.s++;
    });
    $("gens").innerHTML = Object.keys(by).map(Number).sort(function (a, b) { return a - b; }).map(function (g) {
      var o = by[g], pd = pct(o.d, o.n), ps = pct(o.s, o.n);
      return '<button type="button" class="gc" data-act="gen" data-gen="' + g + '" aria-pressed="' + (f.gen === g) + '">' +
        '<span class="gh">' + esc(t("gen")) + " " + roman(g) + "</span>" +
        '<span class="gr"><span>' + esc(t("dexL")) + " · " + o.d + "/" + o.n + "</span><b>" + pd + '%</b><span class="bar dexbar"><i style="width:' + pd + '%"></i></span></span>' +
        '<span class="gr"><span>' + esc(t("shinyL")) + " · " + o.s + "/" + o.n + "</span><b>" + ps + '%</b><span class="bar"><i style="width:' + ps + '%"></i></span></span></button>';
    }).join("");
  }
  function renderFilters(list, exCount) {
    var gens = {}, got = 0, dexc = 0, leg = 0, tleg = 0, myth = 0, tmyth = 0;
    list.forEach(function (p) {
      var g = caught.has(p.id);
      if (hasN(p.id)) dexc++;
      gens[p.g] = gens[p.g] || [0, 0]; gens[p.g][1]++; if (g) gens[p.g][0]++;
      if (g) got++;
      if (p.l) { tleg++; if (g) leg++; }
      if (p.m) { tmyth++; if (g) myth++; }
    });
    $("f-gen").innerHTML = chip("gen", 0, t("allF")) +
      Object.keys(gens).map(Number).sort(function (a, b) { return a - b; }).map(function (g) {
        return chip("gen", g, roman(g), gens[g][0] + "/" + gens[g][1]);
      }).join("");
    $("f-cat").innerHTML = chip("cat", "all", t("allM")) +
      chip("cat", "leg", t("leg"), leg + "/" + tleg) + chip("cat", "myth", t("myth"), myth + "/" + tmyth);
    $("f-st").innerHTML = chip("st", "all", t("allM")) +
      chip("st", "notcaught", t("fNot"), list.length - dexc) + chip("st", "caught", t("fCap"), dexc) +
      chip("st", "got", t("fShinyGot"), got) + chip("st", "missing", t("fShinyMiss"), list.length - got) +
      chip("st", "excluded", t("exC"), exCount);
    var fc = {};
    list.forEach(function (p) {
      var k = p.f || "base";
      fc[k] = fc[k] || [0, 0]; fc[k][1]++; if (caught.has(p.id)) fc[k][0]++;
    });
    $("f-form").innerHTML = chip("form", "all", t("allF")) +
      (fc.base ? chip("form", "base", t("base"), fc.base[0] + "/" + fc.base[1]) : "") +
      FORMS.filter(function (k) { return fc[k]; }).map(function (k) {
        return chip("form", k, t(FLBL[k]), fc[k][0] + "/" + fc[k][1]);
      }).join("");
  }
  function filtered(list) {
    var q = norm(f.q.trim()).replace(/^#/, "");
    return list.filter(function (p) {
      if (f.gen && p.g !== f.gen) return false;
      var c = cat(p);
      if (f.cat !== "all" && c !== f.cat) return false;
      if (f.form === "base" && p.f) return false;
      if (f.form !== "all" && f.form !== "base" && p.f !== f.form) return false;
      var g = caught.has(p.id);
      if (f.st === "excluded") { if (!excluded.has(p.id)) return false; }
      else if (excluded.has(p.id)) return false;
      var dx = hasN(p.id);
      if (f.st === "notcaught" && dx) return false;
      if (f.st === "caught" && !dx) return false;
      if (f.st === "got" && !g) return false;
      if (f.st === "missing" && g) return false;
      if (q) {
        var hay = norm(nameOf(p)) + " " + norm(p.n.en || p.s);
        if (hay.indexOf(q) < 0 && String(p.b).indexOf(q) < 0) return false;
      }
      return true;
    });
  }
  function tileHTML(p) {
    var x = excluded.has(p.id), g = caught.has(p.id) && !x, nm = nameOf(p), c = cat(p);
    var o = !x && !g && owned.has(p.id), dn = !x && hasN(p.id);
    var src = SPR + (g ? "shiny/" : "") + p.id + ".png";
    var fl = formLabel(p);
    var label = nm + (fl ? " (" + fl + ")" : "") + " #" + p.b + " — " + (x ? t("exC") : g ? t("gotS") : o ? t("capS") : t("notS"));
    return '<li class="tile' + (g ? " got" : "") + (o ? " own" : "") + (x ? " excl" : "") + (selected === p.id ? " sel" : "") + '" data-id="' + p.id + '">' +
      '<button type="button" class="open" data-act="open" aria-label="' + esc(label) + '">' +
      '<span class="no">#' + pad(p.b) + "</span>" +
      '<span class="art"><span class="mono">' + esc(nm.charAt(0)) + '</span><img src="' + src + '" alt="" loading="lazy" width="84" height="84">' + SPARK + "</span>" +
      '<span class="nm">' + esc(nm) + '</span><span class="tag">' + esc(fl || (c ? t(c === "leg" ? "legS" : "mythS") : "")) + "</span></button>" +
      '<div class="acts">' +
      '<button type="button" class="ab cap" data-act="cap"' + (g ? " disabled" : "") + ' aria-pressed="' + dn + '" aria-label="' + esc((dn ? t("uncapT") : t("capT")) + " : " + nm) + '" title="' + esc(g ? t("capLock") : dn ? t("uncapT") : t("capT")) + '">' + BALL + "</button>" +
      '<button type="button" class="ab mark" data-act="mark" aria-pressed="' + g + '" aria-label="' + esc(t("mark") + " : " + nm) + '" title="' + esc(t("mark")) + '">' + STAR + "</button>" +
      '<button type="button" class="ab exb" data-act="exclude" aria-pressed="' + x + '" aria-label="' + esc((x ? t("unT") : t("exT")) + " : " + nm) + '" title="' + esc(x ? t("unT") : t("exT")) + '">' + BAN + "</button></div></li>";
  }
  function render() {
    var all = dexList();
    var list = all.filter(function (p) { return !excluded.has(p.id); });   // ce que l'utilisateur veut attraper
    var exCount = all.length - list.length;
    var n = 0; list.forEach(function (p) { if (caught.has(p.id)) n++; });
    $("n-got").textContent = n; $("n-all").textContent = list.length;
    $("bar").style.width = (list.length ? n / list.length * 100 : 0) + "%";
    var nd = 0; list.forEach(function (p) { if (hasN(p.id)) nd++; });
    $("n-dex").textContent = nd; $("n-dex-all").textContent = list.length;
    $("bar-dex").style.width = (list.length ? nd / list.length * 100 : 0) + "%";
    renderGens(list);
    renderFilters(list, exCount);
    var shown = filtered(all);
    var base = f.st === "excluded" ? exCount : list.length;
    $("grid").innerHTML = shown.map(tileHTML).join("");
    $("empty").hidden = shown.length > 0 || all.length === 0;
    $("count").textContent = t("count").replace("{n}", shown.length).replace("{t}", base);
  }
  function scheduleRender() {
    if (renderTimer) return;
    renderTimer = setTimeout(function () { renderTimer = 0; render(); }, 350);
  }

  function gamesHTML(p) {
    var out = '<div class="games"><h3>' + esc(t("gamesH")) + "</h3>";
    if (!META) return out + '<p class="gnote">' + esc(t("loadGames")) + "</p></div>";
    out += '<div class="legend"><span><span class="g yes">' + esc(t("avail")) + '</span></span><span><span class="g">' + esc(t("unk")) + "</span></span></div>";
    out += '<p class="gnote">' + esc(t("gnote")) + "</p>";
    if (p.f) out += '<p class="gnote">' + esc(t("gnoteF")) + "</p>";
    var byGen = {};
    META.forEach(function (g) { (byGen[g.g] = byGen[g.g] || []).push(g); });
    Object.keys(byGen).map(Number).sort(function (a, b) { return a - b; }).forEach(function (gn) {
      out += '<div class="gen"><h4>' + esc(t("gen")) + " " + roman(gn) + '</h4><div class="gchips">';
      byGen[gn].forEach(function (grp) {
        var yes = avail(p, grp), na = grp.d.length === 0;
        grp.v.forEach(function (v) {
          out += '<span class="g' + (yes ? " yes" : na ? " na" : "") + '">' + esc(pick(v.n, v.s)) + "</span>";
        });
      });
      out += "</div></div>";
    });
    return out + "</div>";
  }
  function renderDetail() {
    var el = $("detail");
    var p = selected && S[selected];
    if (!p) {
      el.dataset.open = "false";
      el.innerHTML = '<p class="hint">' + esc(t("pick")) + "</p>";
      return;
    }
    var x = excluded.has(p.id), g = caught.has(p.id) && !x, c = cat(p);
    var o = !x && !g && owned.has(p.id), dn = !x && hasN(p.id);
    var A = SPR + "other/official-artwork/";
    el.dataset.open = "true";
    el.innerHTML = '<button type="button" class="close" data-act="close">' + esc(t("close")) + "</button>" +
      "<div><h2 class=\"dname\">" + esc(nameOf(p)) + '</h2><p class="dmeta"><b>#' + pad(p.b) + "</b> · " + esc(t("gen")) + " " + roman(p.g) + (p.f ? " · " + esc(formLabel(p)) : "") + (c ? " · " + esc(t(c === "leg" ? "legS" : "mythS")) : "") + "</p>" +
      '<p class="status' + (g ? " got" : "") + '">' + esc(x ? t("exS") : g ? t("gotS") : o ? t("capS") : t("notS")) + "</p></div>" +
      '<div class="pair">' +
      '<figure class="fig' + (g ? "" : " on") + '"><img src="' + A + p.id + '.png" data-fb="' + SPR + p.id + '.png" alt=""><figcaption>' + esc(t("normal")) + "</figcaption></figure>" +
      '<figure class="fig' + (g ? " on" : "") + '"><img src="' + A + "shiny/" + p.id + '.png" data-fb="' + SPR + "shiny/" + p.id + '.png" alt=""><figcaption>' + esc(t("shinyL")) + "</figcaption></figure></div>" +
      (x ? "" : '<button type="button" class="cta' + (dn ? " on" : "") + '" data-act="cap-detail"' + (g ? " disabled" : "") + ' title="' + esc(g ? t("capLock") : "") + '">' + esc(dn ? t("uncapD") : t("capD")) + "</button>" +
        '<button type="button" class="cta' + (g ? " on" : "") + '" data-act="toggle-detail">' + esc(g ? t("unmark") : t("mark")) + "</button>") +
      '<button type="button" class="cta on" data-act="excl-detail">' + esc(x ? t("unD") : t("exD")) + "</button>" +
      gamesHTML(p);
  }

  function applyLang() {
    document.documentElement.lang = lang === "ja-Hrkt" ? "ja" : lang;
    $("sub").textContent = t("sub");
    $("t-lang").textContent = t("lang");
    $("t-shiny").textContent = t("shinyL"); $("t-dex").textContent = t("dexL"); $("l-gens").textContent = t("genProg");
    $("l-form").textContent = t("form");
    $("t-showmega").textContent = t("showMega");
    $("show-mega").checked = showMega;
    renderDiag();
    $("l-gen").textContent = t("gen"); $("l-cat").textContent = t("cat"); $("l-st").textContent = t("st"); $("l-q").textContent = t("q");
    $("q").placeholder = t("qph");
    $("empty-text").textContent = t("empty"); $("reset").textContent = t("reset");
    $("b-export").textContent = t("exp"); $("b-import").textContent = t("imp"); $("b-refresh").textContent = t("refresh");
    $("retry").textContent = t("retry");
    if (!$("err").hidden) $("err-text").textContent = t("err");
    progress(doneCount);
    render(); renderDetail();
  }

  function toggle(id) {
    if (caught.has(id)) caught.delete(id); else { caught.add(id); owned.add(id); }
    saveCaught(); saveOwned();
    render(); renderDetail();
    var b = document.querySelector('.tile[data-id="' + id + '"] .mark');
    if (b && document.activeElement === document.body) b.focus();
  }

  // Pokédex normal : un shiny obtenu compte déjà comme capturé, son bouton est donc verrouillé
  function toggleCap(id) {
    if (caught.has(id)) return;
    if (owned.has(id)) owned.delete(id); else owned.add(id);
    saveOwned();
    render(); renderDetail();
  }
  function toggleEx(id) {
    if (excluded.has(id)) excluded.delete(id); else excluded.add(id);
    saveExcluded();
    render(); renderDetail();
  }

  // ---------- Événements ----------
  document.addEventListener("click", function (e) {
    var chipEl = e.target.closest(".chip");
    if (chipEl) {
      var grp = chipEl.dataset.group, v = chipEl.dataset.val;
      f[grp] = grp === "gen" ? Number(v) : v;
      render(); return;
    }
    var act = e.target.closest("[data-act]");
    if (act) {
      var a = act.dataset.act, tile = act.closest(".tile");
      var id = tile ? Number(tile.dataset.id) : selected;
      if (a === "open") { selected = id; render(); renderDetail(); }
      else if (a === "mark") toggle(id);
      else if (a === "toggle-detail") toggle(selected);
      else if (a === "cap") toggleCap(id);
      else if (a === "cap-detail") toggleCap(selected);
      else if (a === "gen") { var gn = Number(act.dataset.gen); f.gen = f.gen === gn ? 0 : gn; render(); }
      else if (a === "exclude") toggleEx(id);
      else if (a === "excl-detail") toggleEx(selected);
      else if (a === "close") { selected = null; render(); renderDetail(); }
      return;
    }
    if (e.target.id === "reset") { f = { gen: 0, cat: "all", form: "all", st: "all", q: "" }; $("q").value = ""; render(); }
    if (e.target.id === "retry") start();
    if (e.target.id === "b-export") exportData();
    if (e.target.id === "b-import") $("file").click();
    if (e.target.id === "b-refresh") {
      try { localStorage.removeItem(CACHE_KEY); } catch (er) {}
      S = {}; META = null; complete = false; total = 0; exList = []; render(); renderDetail(); renderDiag(); start();
    }
  });
  $("q").addEventListener("input", function (e) { f.q = e.target.value; render(); });
  $("show-mega").addEventListener("change", function (e) {
    showMega = e.target.checked;
    try { localStorage.setItem(SHOWMEGA_KEY, showMega ? "1" : "0"); } catch (er) {}
    if (!showMega && (f.form === "mega" || f.form === "gmax")) f.form = "all";
    if (!showMega && selected && S[selected] && (S[selected].f === "mega" || S[selected].f === "gmax")) selected = null;
    render(); renderDetail();
  });
  $("lang").addEventListener("change", function (e) {
    lang = e.target.value;
    try { localStorage.setItem(LANG_KEY, lang); } catch (er) {}
    applyLang();
  });
  $("file").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        var arr = Array.isArray(d) ? d : d.caught;
        if (Array.isArray(arr)) arr.forEach(function (n) { if (Number.isInteger(n) && n > 0) caught.add(n); });
        if (!Array.isArray(d) && Array.isArray(d.excluded)) d.excluded.forEach(function (n) { if (Number.isInteger(n) && n > 0) excluded.add(n); });
        if (!Array.isArray(d) && Array.isArray(d.owned)) d.owned.forEach(function (n) { if (Number.isInteger(n) && n > 0) owned.add(n); });
        saveCaught(); saveExcluded(); saveOwned(); render(); renderDetail();
      } catch (er) {}
    };
    r.readAsText(file);
    e.target.value = "";
  });
  // Image absente : on tente le petit sprite, sinon on affiche l'initiale
  document.addEventListener("error", function (e) {
    var el = e.target;
    if (!el || el.tagName !== "IMG") return;
    if (el.dataset.fb && !el.dataset.fbd) { el.dataset.fbd = "1"; el.src = el.dataset.fb; return; }
    var par = el.parentNode;
    if (par) par.classList.add(par.classList.contains("fig") ? "broken" : "noimg");
    if (!par || !par.classList.contains("fig")) el.remove();
  }, true);

  function exportData() {
    var blob = new Blob([JSON.stringify({ app: "pokedex-shiny", caught: Array.from(caught).sort(function (a, b) { return a - b; }), excluded: Array.from(excluded).sort(function (a, b) { return a - b; }), owned: Array.from(owned).sort(function (a, b) { return a - b; }) })], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "pokedex-shiny.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ---------- Démarrage ----------
  function start() {
    var work = [];
    if (!complete) work.push(loadSpecies().catch(function () { showErr(); }));
    else $("loader").hidden = true;
    if (!META) work.push(loadMeta().catch(function () {}));
    return Promise.all(work);
  }
  $("lang").innerHTML = LANGS.map(function (l) { return '<option value="' + l[0] + '">' + esc(l[1]) + "</option>"; }).join("");
  $("lang").value = lang;
  applyLang();
  start();
})();
</script>
</body>
</html>
